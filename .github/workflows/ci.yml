name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Core tests
        run: swift test && swift test -c release
      - name: Release build
        run: xcodebuild -project 'Music Analysis Studio.xcodeproj' -scheme 'Music Analysis Studio' -configuration Release -destination 'platform=macOS' -derivedDataPath build build
      - name: iPad Release build
        run: xcodebuild -project 'Music Analysis Studio.xcodeproj' -scheme 'Music Analysis Studio' -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: iOS device compile
        run: xcodebuild -project 'Music Analysis Studio.xcodeproj' -scheme 'Music Analysis Studio' -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Native workflow
        run: bash Scripts/test-ui.sh
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-workflow
          path: |
            build/Screenshots
            build/Workflow-*.xcresult
          if-no-files-found: ignore
